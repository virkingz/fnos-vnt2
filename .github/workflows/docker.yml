name: docker

# 构建多架构镜像并推送到 GitHub Container Registry（GHCR）。
# 与 build.yml（打包 fpk）职责分离：这个只管容器镜像。
#
# 推送到 GHCR 不需要任何额外密钥，用内置的 GITHUB_TOKEN 即可。
# 镜像地址：ghcr.io/<owner>/<repo>
#
# 想改推 Docker Hub 见 docker/README.md 的「推送到 Docker Hub」一节。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# GHCR 推送需要 packages: write
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # 目标平台。arm/v7 走 QEMU 模拟，构建较慢；
  # 若不需要（只有 x86_64 / arm64 设备）或构建失败，删掉 linux/arm/v7 即可。
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 多架构需要 QEMU 来模拟非宿主架构
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        # PR 只构建不推送，因此不需要登录
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 会产出 ghcr.io/<owner>/<repo>
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            # 分支名，如 main
            type=ref,event=branch
            # 打 tag v1.2.3 时 -> 1.2.3
            type=semver,pattern={{version}}
            # 打 tag v1.2.3 时 -> 1.2
            type=semver,pattern={{major}}.{{minor}}
            # 短 commit sha，便于精确回滚
            type=sha,format=short
            # 默认分支额外打 latest
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=vnt-nas
            org.opencontainers.image.description=VNT 组网（vnt2_web 壳）：令牌托管、核心在线更新、组网面板反代
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          # PR 上只验证能否构建，不推送
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 用 GitHub Actions 缓存加速重复构建（尤其 QEMU 下的 arm 构建）
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像信息
        if: github.event_name != 'pull_request'
        run: |
          echo "### 已推送镜像" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "平台：${{ env.PLATFORMS }}" >> "$GITHUB_STEP_SUMMARY"
