name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查（Python / Shell / JS）
        run: |
          python -m py_compile app/shell/*.py
          for f in cmd/*; do bash -n "$f"; done
          bash -n app/shell/lib.sh

      - name: 运行测试套件
        run: |
          for t in test_update test_rewrite test_mount test_upload test_proxy test_embed test_panel_proxy; do
            echo "── $t ──"
            python "scripts/$t.py"
          done

  build:
    name: 打包 fpk
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Pillow（生成图标）
        run: pip install --quiet pillow

      - name: 打包
        run: bash scripts/pack.sh

      - name: 校验产物
        run: |
          set -e
          ls -lh vnt-nas.fpk
          python - <<'PY'
          import tarfile, hashlib, io
          t = tarfile.open("vnt-nas.fpk")
          names = {m.name for m in t.getmembers()}
          for need in ("manifest", "app.tgz", "config/privilege",
                       "config/resource", "ICON.PNG", "ICON_256.PNG"):
              assert need in names, "缺少 " + need
          modes = {m.name: oct(m.mode & 0o777)
                   for m in t.getmembers()
                   if m.name.startswith("cmd/") and m.isfile()}
          assert modes, "没有生命周期脚本"
          bad = [k for k, v in modes.items() if v != "0o755"]
          assert not bad, "脚本权限不是 755: %s" % bad
          app = t.extractfile("app.tgz").read()
          mf = t.extractfile("manifest").read().decode()
          dec = [l.split("=")[1].strip() for l in mf.splitlines()
                 if l.strip().startswith("checksum")][0]
          assert hashlib.md5(app).hexdigest() == dec, "checksum 不一致"
          print("产物校验通过：%d 个条目" % len(names))
          PY

      - name: 读取版本号
        id: ver
        run: echo "version=$(grep -E '^version' manifest | head -1 | sed 's/.*=[[:space:]]*//')" >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: vnt-nas-fpk
          path: vnt-nas.fpk

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vnt-nas.fpk
          name: VNT 组网 v${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: true
